[package]
name = "windows-taskbar-widgets"
version = "0.1.0"
edition = "2021"

[lib]
name = "windows_taskbar_widgets_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
sysinfo = "0.33"
rusqlite = { version = "0.32", features = ["bundled"] }
tauri_kit_settings = { path = "../vendor/tauri_kit/tauri/settings" }
tokio = { version = "1", features = ["rt-multi-thread"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect"] }
futures-util = { version = "0.3", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[target.'cfg(target_os = "windows")'.dependencies]
nvml-wrapper = "0.10"
wmi = "0.14"
windows-sys = { version = "0.61", features = [
    "Win32_UI_Shell",
    "Win32_Foundation",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
