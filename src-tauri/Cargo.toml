[package]
name = "windows-taskbar-widgets"
# Keep in step with package.json / tauri.conf.json: get_version_info reports this
# via CARGO_PKG_VERSION, so drift shows the wrong version in the settings About row.
version = "0.1.10"
edition = "2021"

[lib]
name = "windows_taskbar_widgets_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2"
# Default features keep this on rustls; native-tls-vendored would drag in
# openssl-sys, which ci.yml explicitly asserts against.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
# Same crate/version tauri itself resolves for app_data_dir(); used here to resolve
# the settings path from Config alone, before an AppHandle exists.
dirs = "6"
sysinfo = "0.33"
rusqlite = { version = "0.32", features = ["bundled"] }
tauri_kit_settings = { path = "../vendor/tauri_kit/tauri/settings" }
tauri_kit_updater = { path = "../vendor/tauri_kit/tauri/updater" }
tauri_kit_window = { path = "../vendor/tauri_kit/tauri/window" }
tokio = { version = "1", features = ["rt-multi-thread"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect"] }
futures-util = { version = "0.3", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# Already resolved transitively (tauri-codegen et al pull 1.24.0); promoted to a direct
# dep only to generate divider ids in settings.rs, no new crate enters the tree.
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "windows")'.dependencies]
nvml-wrapper = "0.10"
wmi = "0.14"
windows-sys = { version = "0.61", features = [
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_Graphics_Gdi",
    "Win32_System_Performance",
    "Win32_System_Memory",
] }
# Media_Control: GlobalSystemMediaTransportControlsSession(Manager) for spotify_smtc.rs.
# Media: MediaPlaybackAutoRepeatMode lives one namespace up from Media::Control, not in it.
windows = { version = "0.62", features = [
    "Media_Control",
    "Media",
    "Foundation",
    "Storage_Streams",
] }
base64 = "0.22"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
